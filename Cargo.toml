[workspace]
members = ["crates/core", "crates/cli", "crates/desktop"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.dev]
debug = 0
[profile.test]
debug = 0
