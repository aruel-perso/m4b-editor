name: Test, package and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CARGO_BUILD_JOBS: 1
  RUST_TEST_THREADS: 1
  CARGO_PROFILE_RELEASE_DEBUG: 0
jobs:
  windows:
    runs-on: ubuntu-24.04
    env:
      TMPDIR: /home/runner/m4b-release-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p "$TMPDIR"
      - id: version
        run: echo "value=$(python3 scripts/release_common.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-gnu-release
      - uses: actions/cache@v4
        id: media-cache
        with:
          path: vendor/windows-media
          key: windows-x86_64-media-${{ hashFiles('scripts/build-ffmpeg-windows.sh', 'scripts/ffmpeg-options.sh', 'scripts/fetch-media-sources.sh', 'scripts/release_common.py') }}
      - name: Build prerequisites (disposable CI runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 wixl msitools wine64 ffmpeg libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - run: python3 scripts/test-source-fetch.py
      - run: python3 scripts/test-release.py --scratch "$TMPDIR"
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - name: Exercise fifteen-minute export and mid-job cancellation
        run: cargo test --locked -p m4b-editor-core --test ffmpeg long_form_export_lifecycle -- --ignored
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build pinned static media tools
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/fetch-media-sources.sh "$TMPDIR"
          bash scripts/build-ffmpeg-windows.sh "$TMPDIR/ffmpeg-8.0.1.tar.xz" "$TMPDIR/zlib-1.3.1.tar.gz" "$TMPDIR/lame-3.100.tar.gz"
      - run: python3 scripts/release_common.py --media vendor/windows-media --platform windows-x86_64
      - name: Cross-compiled Windows Rust tests with bundled tools
        run: |
          cargo test --workspace --locked --target x86_64-pc-windows-gnu --no-run --message-format=json > "$TMPDIR/windows-tests.jsonl"
          python3 scripts/verify-windows-tests.py "$TMPDIR/windows-tests.jsonl"
      - run: python3 scripts/package-release.py
      - name: Verify MSI and signer
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 scripts/test-release.py --msi "dist/release-$VERSION/M4B-Editor-$VERSION-windows-x86_64.msi" --scratch "$TMPDIR"
          msiinfo export dist/release-$VERSION/*.msi Property
      - name: Exercise bundled codecs and CLI under Wine
        run: python3 scripts/verify-windows-bundle.py "dist/release-${{ steps.version.outputs.value }}/M4B-Editor-${{ steps.version.outputs.value }}-windows-x86_64.zip" --msi "dist/release-${{ steps.version.outputs.value }}/M4B-Editor-${{ steps.version.outputs.value }}-windows-x86_64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/release-${{ steps.version.outputs.value }}/*.msi
            dist/release-${{ steps.version.outputs.value }}/*.zip
            dist/release-${{ steps.version.outputs.value }}/*.sha256
          if-no-files-found: error
  macos:
    # GitHub's standard public macos-15 runner is AppleSilicon. Fail on any label drift.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require native ARM64 and writable scratch
        run: |
          test "$(uname -m)" = arm64
          echo "TMPDIR=$RUNNER_TEMP/m4b-release" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/m4b-release"
      - id: version
        run: echo "value=$(python3 scripts/release_common.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-aarch64-release
      - uses: actions/cache@v4
        id: media-cache
        with:
          path: vendor/macos-media
          key: macos-aarch64-media-${{ hashFiles('scripts/build-ffmpeg-macos.sh', 'scripts/build-ffmpeg-unix.sh', 'scripts/ffmpeg-options.sh', 'scripts/fetch-media-sources.sh', 'scripts/release_common.py', 'scripts/verify-macos.py') }}
      - name: Build pinned native static media tools
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/fetch-media-sources.sh "$TMPDIR"
          bash scripts/build-ffmpeg-macos.sh "$TMPDIR/ffmpeg-8.0.1.tar.xz" "$TMPDIR/zlib-1.3.1.tar.gz" "$TMPDIR/lame-3.100.tar.gz"
      - run: python3 scripts/release_common.py --media vendor/macos-media --platform macos-aarch64
      - name: Native workspace checks with bundled media
        run: |
          export PATH="$PWD/vendor/macos-media:$PATH"
          cargo fetch --locked
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 scripts/package-macos.py
      - name: Mount DMG and exercise installed CLI (no GUI test)
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/test-macos-release.py --dmg "dist/release-$VERSION/M4B-Editor-$VERSION-macos-aarch64.dmg" --scratch "$TMPDIR"
      - name: Build and mount optional legacy helper DMG
        run: |
          python3 scripts/package-macos.py --legacy --out dist/legacy-macos
          python3 scripts/test-macos-release.py --legacy --dmg "dist/legacy-macos/m4b-Craft-${{ steps.version.outputs.value }}-macos-aarch64.dmg" --scratch "$TMPDIR"
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-macos-compatibility
          path: dist/legacy-macos/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/release-${{ steps.version.outputs.value }}/*.dmg
            dist/release-${{ steps.version.outputs.value }}/*.zip
            dist/release-${{ steps.version.outputs.value }}/*.sha256
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    env:
      TMPDIR: /home/runner/m4b-linux-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p "$TMPDIR"
      - id: version
        run: echo "value=$(python3 scripts/release_common.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64-release
      - uses: actions/cache@v4
        id: media-cache
        with:
          path: vendor/linux-media
          key: linux-x86_64-media-${{ hashFiles('scripts/build-ffmpeg-unix.sh', 'scripts/ffmpeg-options.sh', 'scripts/fetch-media-sources.sh', 'scripts/release_common.py') }}
      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev unzip xvfb xauth xdotool libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libegl1 libgl1 xdg-utils
      - name: Build pinned native media tools
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/fetch-media-sources.sh "$TMPDIR"
          bash scripts/build-ffmpeg-unix.sh linux "$TMPDIR/ffmpeg-8.0.1.tar.xz" "$TMPDIR/zlib-1.3.1.tar.gz" "$TMPDIR/lame-3.100.tar.gz"
      - run: python3 scripts/release_common.py --media vendor/linux-media --platform linux-x86_64
      - name: Test with pinned Linux media
        run: |
          export PATH="$PWD/vendor/linux-media:$PATH"
          cargo fetch --locked
          cargo test --locked --workspace
      - run: python3 scripts/package-linux.py
      - name: Install DEB and exercise installed and portable CLI
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          DEB="dist/release-$VERSION/M4B-Editor-$VERSION-linux-x86_64.deb"
          sudo apt-get install -y "./$DEB"
          python3 scripts/test-linux-release.py --deb "$DEB" --scratch "$TMPDIR"
          xvfb-run -a python3 scripts/smoke-desktop.py /usr/bin/m4b-editor
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/release-${{ steps.version.outputs.value }}/*.deb
            dist/release-${{ steps.version.outputs.value }}/*.zip
            dist/release-${{ steps.version.outputs.value }}/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'aruel-perso/m4b-editor'
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    env:
      TMPDIR: /home/runner/m4b-release-${{ github.run_id }}
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release-assets
      - name: Validate tag and flat assets before accessing signing key
        run: |
          VERSION=$(python3 scripts/release_common.py)
          test "$GITHUB_REF_NAME" = "v$VERSION"
          python3 scripts/verify-release-assets.py release-assets --version "$VERSION"
      - name: Sign platform manifests
        env:
          UPDATE_SIGNING_PEM: ${{ secrets.UPDATE_SIGNING_PEM }}
        run: |
          test -n "$UPDATE_SIGNING_PEM"
          mkdir -p "$TMPDIR"
          umask 077
          trap 'rm -f "$TMPDIR/update-signing.pem"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_PEM" > "$TMPDIR/update-signing.pem"
          VERSION=$(python3 scripts/release_common.py)
          for PLATFORM in windows-x86_64 macos-aarch64 linux-x86_64; do
            case "$PLATFORM" in
              windows-x86_64) EXT=msi ;;
              macos-aarch64) EXT=dmg ;;
              linux-x86_64) EXT=deb ;;
            esac
            python3 scripts/sign-update.py --key "$TMPDIR/update-signing.pem" --version "$VERSION" --platform "$PLATFORM" --installer "release-assets/M4B-Editor-$VERSION-$PLATFORM.$EXT" --out "release-assets/update-v2-$PLATFORM.json" --scratch "$TMPDIR"
          done
      - name: Verify final signed allowlist
        run: python3 scripts/verify-release-assets.py release-assets --signed
      - name: Publish only after all builds, validation and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then FLAGS+=(--prerelease); fi
          NOTES="$RUNNER_TEMP/m4b-release-notes.md"
          {
            cat docs/release.md
            printf '\n## SHA-256\n\n```text\n'
            cat release-assets/*.sha256
            printf '```\n'
          } > "$NOTES"
          gh release create "$GITHUB_REF_NAME" release-assets/*.{msi,dmg,deb,zip,json} --repo "$GITHUB_REPOSITORY" --verify-tag "${FLAGS[@]}" --title "M4B Editor ${GITHUB_REF_NAME#v}" --notes-file "$NOTES"
